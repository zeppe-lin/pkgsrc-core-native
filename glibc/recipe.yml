format: zeppe-lin.recipe/1
package:
  name: glibc
  version: 2.44
  release: 3
  summary: GNU C Library
  homepage: https://www.gnu.org/software/libc/
  licenses:
    - GPL-2.0-or-later
    - LGPL-2.1-or-later
requirements:
  build:
    - package: linux-api-headers
  run:
    - package: libgcc
sources:
  - url: https://ftp.gnu.org/gnu/glibc/glibc-2.44.tar.xz
    name: glibc-2.44.tar.xz
    unpack: archive
    sha256: 37f600f2bef3c5e8300147059568b2a2e40a7ad6ccc65ce942556d49429cc667
build:
  language: posix-shell
  script: |
    set -eu

    headers="$PKG_BUILD_INPUT_ROOT/linux-api-headers/usr/include"
    test -d "$headers/linux"
    test -d "$headers/asm"

    mkdir glibc-build
    cd glibc-build

    libc_cv_slibdir=/usr/lib \
    libc_cv_rtlddir=/lib64 \
    ../glibc-2.44/configure \
      --prefix=/usr \
      --sysconfdir=/etc \
      --localstatedir=/var \
      --libdir=/usr/lib \
      --libexecdir=/usr/lib \
      --with-headers="$headers" \
      --disable-profile \
      --disable-werror \
      --disable-build-nscd \
      --disable-timezone-tools \
      --enable-bind-now \
      --enable-multi-arch \
      --enable-stack-protector=strong \
      --without-gd \
      MAKEINFO=missing

    make -j "$PKG_JOBS"
    make install_root="$PKG_DESTDIR" install

    # The native build policy closes execution locale at C.UTF-8. Install that
    # exact locale into the target libc payload using the newly built loader
    # and localedef, rather than inheriting locale authority from the seed.
    mkdir -p "$PKG_DESTDIR/usr/lib/locale"
    LC_ALL=C ./elf/ld.so --library-path . \
      "$PKG_DESTDIR/usr/bin/localedef" \
      --prefix="$PKG_DESTDIR" \
      -i ../glibc-2.44/localedata/locales/C \
      -f ../glibc-2.44/localedata/charmaps/UTF-8 \
      C.UTF-8
    LC_ALL=C ./elf/ld.so --library-path . \
      "$PKG_DESTDIR/usr/bin/localedef" \
      --prefix="$PKG_DESTDIR" \
      --list-archive | grep -Fx 'C.utf8' >/dev/null

    # The x86_64 ABI names /lib64/ld-linux-x86-64.so.2 as the interpreter,
    # but filesystem owns the merged-/usr aliases.  Upstream install logic may
    # stage ABI material through either /lib64 or /usr/lib64; neither spelling
    # is package namespace authority for libc.  Normalize both into /usr/lib
    # before sealing the final image.
    normalize_lib_alias()
    {
      alias=$1
      source="$PKG_DESTDIR/$alias"
      [ ! -L "$source" ] || {
        printf '%s\n' "glibc: package payload unexpectedly owns alias symlink $alias" >&2
        exit 1
      }
      [ -d "$source" ] || return 0
      mkdir -p "$PKG_DESTDIR/usr/lib"
      for path in "$source"/*; do
        [ -e "$path" ] || [ -L "$path" ] || continue
        mv "$path" "$PKG_DESTDIR/usr/lib/"
      done
      rmdir "$source"
    }

    normalize_lib_alias lib64
    normalize_lib_alias usr/lib64
    test -e "$PKG_DESTDIR/usr/lib/ld-linux-x86-64.so.2"

    # No ordinary package may publish below the aliases owned by filesystem.
    # Keep this as a build-time assault so an upstream layout change dies while
    # constructing glibc rather than during target application hours later.
    for alias in bin sbin lib lib32 lib64 usr/lib64; do
      path="$PKG_DESTDIR/$alias"
      [ ! -L "$path" ] || {
        printf '%s\n' "glibc: final payload owns merged-/usr alias $alias" >&2
        exit 1
      }
      if [ -d "$path" ]; then
        if find "$path" -mindepth 1 -print -quit | grep . >/dev/null; then
          printf '%s\n' "glibc: final payload retains merged-/usr descendants below $alias" >&2
          exit 1
        fi
        rmdir "$path"
      fi
      [ ! -e "$path" ] || {
        printf '%s\n' "glibc: final payload retains merged-/usr object $alias" >&2
        exit 1
      }
    done

    # libc owns runtime/library ABI, headers and static data. Machine policy,
    # service state, timezone policy and interpreter-dependent helper scripts
    # are separate authorities.
    rm -rf "$PKG_DESTDIR/etc" "$PKG_DESTDIR/var" "$PKG_DESTDIR/usr/share/info"
    rm -f \
      "$PKG_DESTDIR/usr/bin/ldd" \
      "$PKG_DESTDIR/usr/bin/mtrace" \
      "$PKG_DESTDIR/usr/bin/sotruss" \
      "$PKG_DESTDIR/usr/bin/xtrace"
architectures:
  build: [x86_64]
  target: [x86_64]
