format: zeppe-lin.recipe/1
package:
  name: zlib
  version: 1.3.2
  release: 1
  summary: Compression and decompression library
  homepage: https://zlib.net/
  licenses:
    - Zlib
requirements: {}
sources:
  - url: https://www.zlib.net/zlib-1.3.2.tar.gz
    name: zlib-1.3.2.tar.gz
    sha256: bb329a0a2cd0274d05519d61c667c062e06990d72e125ee2dfa8de64f0119d16
build:
  language: posix-shell
  script: |
    set -eu

    tar -xf "$PKG_SOURCE_ROOT/zlib-1.3.2.tar.gz"
    mkdir build
    cd build

    ../zlib-1.3.2/configure \
      --prefix=/usr \
      --sharedlibdir=/lib

    make -j "$PKG_JOBS"
    make DESTDIR="$PKG_DESTDIR" install

    ln -sf ../../lib/libz.so.1.3.2 "$PKG_DESTDIR/usr/lib/libz.so"
    rm "$PKG_DESTDIR/lib/libz.so"
