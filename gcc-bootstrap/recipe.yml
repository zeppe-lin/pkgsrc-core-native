format: zeppe-lin.recipe/1
package:
  name: gcc-bootstrap
  version: 16.1.0
  release: 4
  summary: GCC C and C++ construction compiler authority
  homepage: https://gcc.gnu.org/
  licenses:
    - GPL-3.0-or-later WITH GCC-exception-3.1
requirements:
  build:
    - package: filesystem
    - package: glibc
    - package: linux-api-headers
    - package: gmp-bootstrap
    - package: mpfr-bootstrap
    - package: mpc-bootstrap
  check:
    - package: filesystem
    - package: glibc
    - package: linux-api-headers
    - package: binutils-bootstrap
  run:
    - package: filesystem
    - package: glibc
    - package: linux-api-headers
    - package: binutils-bootstrap
sources:
  - url: https://ftp.gnu.org/gnu/gcc/gcc-16.1.0/gcc-16.1.0.tar.xz
    name: gcc-16.1.0.tar.xz
    unpack: archive
    sha256: 50efb4d94c3397aff3b0d61a5abd748b4dd31d9d3f2ab7be05b171d36a510f79
build:
  language: posix-shell
  script: |
    set -eu
    LC_ALL=C
    export LC_ALL

    fail()
    {
      printf '%s\n' "gcc-bootstrap: $*" >&2
      exit 1
    }

    filesystem="$PKG_BUILD_INPUT_ROOT/filesystem"
    glibc="$PKG_BUILD_INPUT_ROOT/glibc"
    linux_headers="$PKG_BUILD_INPUT_ROOT/linux-api-headers"
    gmp="$PKG_BUILD_INPUT_ROOT/gmp-bootstrap"
    mpfr="$PKG_BUILD_INPUT_ROOT/mpfr-bootstrap"
    mpc="$PKG_BUILD_INPUT_ROOT/mpc-bootstrap"

    test -L "$filesystem/lib64" || fail 'filesystem /lib64 authority is absent'
    test "$(readlink "$filesystem/lib64")" = usr/lib64 || \
      fail 'filesystem /lib64 authority differs'
    test -L "$filesystem/usr/lib64" || fail 'filesystem /usr/lib64 authority is absent'
    test "$(readlink "$filesystem/usr/lib64")" = lib || \
      fail 'filesystem /usr/lib64 authority differs'
    test -f "$glibc/usr/include/gnu/stubs.h" || fail 'final glibc headers are absent'
    test -f "$glibc/usr/lib/crt1.o" || fail 'final glibc start files are absent'
    test -f "$glibc/usr/lib/libc.so" || fail 'final glibc linker authority is absent'
    test -e "$glibc/usr/lib/ld-linux-x86-64.so.2" || fail 'final glibc loader is absent'
    test -f "$linux_headers/usr/include/linux/errno.h" || \
      fail 'Linux UAPI errno authority is absent'

    # GCC accepts one build sysroot for target topology, headers, start files,
    # libraries, and runtime objects.  The merged-/usr filesystem aliases,
    # glibc, and Linux UAPI remain independently sealed package authorities, so
    # derive the single temporary root explicitly from those exact direct
    # inputs instead of pretending any package tree is a complete target root
    # or making dependency visibility transitive.
    sysroot="$PKG_BUILD_ROOT/gcc-bootstrap-sysroot"
    mkdir -p "$sysroot"
    add_sysroot_authority()
    {
      tree=$1
      label=$2
      (
        cd "$tree"
        find . \( -type f -o -type l \) -print
      ) | while IFS= read -r path; do
        test ! -e "$sysroot/$path" && test ! -L "$sysroot/$path" ||
          fail "target sysroot authority collision: $label:$path"
      done
      (cd "$tree" && tar -cf - .) | (cd "$sysroot" && tar -xf -)
    }
    add_sysroot_authority "$filesystem" filesystem
    add_sysroot_authority "$glibc" glibc
    add_sysroot_authority "$linux_headers" linux-api-headers
    test -L "$sysroot/lib64" || fail 'composed target sysroot lost /lib64 topology'
    test -L "$sysroot/usr/lib64" || fail 'composed target sysroot lost /usr/lib64 topology'
    test -e "$sysroot/lib64/ld-linux-x86-64.so.2" ||
      fail 'composed target sysroot cannot resolve the glibc loader'
    test -f "$sysroot/usr/include/linux/errno.h" ||
      fail 'composed target sysroot lost Linux UAPI authority'

    arithmetic="$PKG_BUILD_ROOT/gcc-bootstrap-arithmetic"
    mkdir -p "$arithmetic/include" "$arithmetic/lib"
    for header in \
        "$gmp/usr/include/gmp.h" \
        "$mpfr/usr/include/mpfr.h" \
        "$mpc/usr/include/mpc.h"; do
      test -f "$header" || fail "arithmetic header is absent: ${header##*/}"
      install -m 0644 "$header" "$arithmetic/include/${header##*/}"
    done
    for library in \
        "$gmp/usr/lib/libgmp.a" \
        "$mpfr/usr/lib/libmpfr.a" \
        "$mpc/usr/lib/libmpc.a"; do
      test -f "$library" || fail "static arithmetic library is absent: ${library##*/}"
      install -m 0644 "$library" "$arithmetic/lib/${library##*/}"
    done

    mkdir gcc-bootstrap-build
    cd gcc-bootstrap-build

    ../gcc-16.1.0/configure \
      --prefix=/usr \
      --libdir=/usr/lib \
      --libexecdir=/usr/lib \
      --with-sysroot=/ \
      --with-build-sysroot="$sysroot" \
      --with-native-system-header-dir=/usr/include \
      --with-gmp="$arithmetic" \
      --with-mpfr="$arithmetic" \
      --with-mpc="$arithmetic" \
      --with-as=/usr/bin/as \
      --with-ld=/usr/bin/ld \
      --disable-bootstrap \
      --disable-fixincludes \
      --disable-libgomp \
      --disable-libquadmath \
      --disable-libsanitizer \
      --disable-libssp \
      --disable-libstdcxx-pch \
      --disable-libvtv \
      --disable-lto \
      --disable-multilib \
      --disable-nls \
      --disable-shared \
      --disable-werror \
      --enable-languages=c,c++ \
      --enable-threads=posix \
      --without-isl \
      --without-zstd \
      MAKEINFO=missing

    # This is a seed-built handoff compiler, not final GCC. Build only the C/C++
    # compiler machinery and the static target support required to make it a
    # self-contained construction capability after S0 execution is revoked.
    make -j "$PKG_JOBS" all-gcc
    make -j "$PKG_JOBS" all-target-libgcc
    make -j "$PKG_JOBS" all-target-libstdc++-v3
    make DESTDIR="$PKG_DESTDIR" install-gcc
    make DESTDIR="$PKG_DESTDIR" install-target-libgcc
    make DESTDIR="$PKG_DESTDIR" install-target-libstdc++-v3

    rm -rf "$PKG_DESTDIR/usr/share"
    find "$PKG_DESTDIR" -type f -name '*.la' -delete

    # GCC's x86_64 target-library install uses the OS multilib spelling
    # /usr/lib64 even with one admitted 64-bit variant.  filesystem owns that
    # merged-/usr alias; the bootstrap compiler owns only the static objects.
    # Normalize the staged objects into canonical /usr/lib before sealing the
    # image, and refuse rather than overwrite any independently installed object.
    normalize_lib_alias()
    {
      alias=$1
      source="$PKG_DESTDIR/$alias"
      [ ! -L "$source" ] || fail "package payload unexpectedly owns alias symlink $alias"
      [ -d "$source" ] || return 0
      mkdir -p "$PKG_DESTDIR/usr/lib"
      for path in "$source"/*; do
        [ -e "$path" ] || [ -L "$path" ] || continue
        [ ! -d "$path" ] || [ -L "$path" ] ||
          fail "unexpected directory below $alias: ${path##*/}"
        target="$PKG_DESTDIR/usr/lib/${path##*/}"
        [ ! -e "$target" ] && [ ! -L "$target" ] ||
          fail "canonical library collision while normalizing $alias: ${path##*/}"
        mv "$path" "$target"
      done
      rmdir "$source"
    }
    normalize_lib_alias usr/lib64

    # No construction package may publish below aliases owned by filesystem.
    for alias in bin sbin lib lib32 lib64 usr/lib64; do
      path="$PKG_DESTDIR/$alias"
      [ ! -L "$path" ] || fail "final payload owns merged-/usr alias $alias"
      if [ -d "$path" ]; then
        if find "$path" -mindepth 1 -print -quit | grep . >/dev/null; then
          fail "final payload retains merged-/usr descendants below $alias"
        fi
        rmdir "$path"
      fi
      [ ! -e "$path" ] || fail "final payload retains merged-/usr object $alias"
    done

    # A bootstrap compiler may carry private static compiler/runtime support,
    # but it must not compete with stable libgcc or create an interim shared
    # libstdc++ runtime package. The final toolchain owns those shared ABIs.
    if find "$PKG_DESTDIR" -type f -o -type l | \
        grep -E '/(libgcc_s|libstdc\+\+)\.so([.]|$)' >/dev/null; then
      fail 'shared compiler runtime escaped into bootstrap compiler payload'
    fi

    test -x "$PKG_DESTDIR/usr/bin/gcc" || fail 'gcc driver is absent'
    test -x "$PKG_DESTDIR/usr/bin/g++" || fail 'g++ driver is absent'
    ensure_driver_entry()
    {
      path=$1
      target=$2
      label=$3
      if [ ! -e "$path" ] && [ ! -L "$path" ]; then
        ln -s "$target" "$path"
      fi
      test -x "$path" || fail "$label driver entry is absent"
      if [ -L "$path" ]; then
        link=$(readlink "$path")
        case $link in
          "$target"|"./$target") ;;
          *) fail "$label driver entry points outside its canonical driver" ;;
        esac
      fi
    }
    ensure_driver_entry "$PKG_DESTDIR/usr/bin/cc" gcc cc
    ensure_driver_entry "$PKG_DESTDIR/usr/bin/c++" g++ c++

    compiler_dir=$(find "$PKG_DESTDIR/usr/lib/gcc" -mindepth 2 -maxdepth 2 \
      -type d -name '16.1.0' -print)
    test -n "$compiler_dir" || fail 'compiler private directory is absent'
    test "$(printf '%s\n' "$compiler_dir" | wc -l | tr -d ' ')" = 1 || \
      fail 'compiler private directory is ambiguous'
    test -x "$compiler_dir/cc1" || fail 'C frontend is absent'
    test -x "$compiler_dir/cc1plus" || fail 'C++ frontend is absent'
    test -f "$compiler_dir/libgcc.a" || fail 'private static libgcc is absent'

    libstdcxx=$(find "$PKG_DESTDIR/usr" -type f -name 'libstdc++.a' -print)
    test -n "$libstdcxx" || fail 'static libstdc++ construction runtime is absent'
    test "$(printf '%s\n' "$libstdcxx" | wc -l | tr -d ' ')" = 1 || \
      fail 'static libstdc++ construction runtime is ambiguous'
    test "$libstdcxx" = "$PKG_DESTDIR/usr/lib/libstdc++.a" ||
      fail 'static libstdc++ construction runtime is not canonical'

    test -x "$compiler_dir/collect2" || fail 'link driver is absent'

    for program in \
        "$PKG_DESTDIR/usr/bin/gcc" \
        "$PKG_DESTDIR/usr/bin/g++" \
        "$compiler_dir/cc1" \
        "$compiler_dir/cc1plus" \
        "$compiler_dir/collect2"; do
      dynamic=$(readelf -d "$program") || fail "readelf rejected ${program##*/}"
      if printf '%s\n' "$dynamic" | grep -E '\((RPATH|RUNPATH)\)' >/dev/null; then
        fail "${program##*/} carries a construction search path"
      fi
      if printf '%s\n' "$dynamic" | grep -E \
          'Shared library: \[(libstdc\+\+|libgcc_s|libgmp|libmpfr|libmpc|libz|libzstd)\.so' \
          >/dev/null; then
        fail "${program##*/} retains seed/external compiler-runtime authority"
      fi
      interpreter=$(readelf -l "$program" | \
        sed -n 's/.*Requesting program interpreter: \([^]]*\)\].*/\1/p')
      case $interpreter in
        /lib/ld-linux-x86-64.so.2|/lib64/ld-linux-x86-64.so.2|/usr/lib/ld-linux-x86-64.so.2) ;;
        *) fail "${program##*/} names an unknown execution loader" ;;
      esac
      test -x "$sysroot$interpreter" ||
        fail "${program##*/} execution loader does not resolve through admitted target root"
    done

    for probe in \
        "$PKG_DESTDIR/usr/bin/gcc -print-search-dirs" \
        "$PKG_DESTDIR/usr/bin/gcc -dumpspecs"; do
      # shellcheck disable=SC2086
      output=$($probe)
      if printf '%s\n' "$output" | grep -E '/build/(inputs|work)|seed-root' >/dev/null; then
        fail 'installed compiler search authority retains bootstrap coordinates'
      fi
    done

    test "$($PKG_DESTDIR/usr/bin/gcc -print-sysroot)" = / || \
      fail 'installed compiler does not use the execution root as sysroot'
    test "$($PKG_DESTDIR/usr/bin/gcc -print-prog-name=as)" = /usr/bin/as || \
      fail 'installed compiler does not bind assembler to execution-root /usr/bin/as'
    test "$($PKG_DESTDIR/usr/bin/gcc -print-prog-name=ld)" = /usr/bin/ld || \
      fail 'installed compiler does not bind linker to execution-root /usr/bin/ld'

    private_libgcc=$($PKG_DESTDIR/usr/bin/gcc -print-libgcc-file-name)
    test -f "$private_libgcc" || fail 'installed compiler private libgcc is unresolved'
    case $private_libgcc in
      "$PKG_DESTDIR"/*) ;;
      *) fail 'installed compiler resolves private libgcc outside its sealed payload' ;;
    esac
check:
  language: posix-shell
  script: |
    set -eu

    fail()
    {
      printf '%s\n' "gcc-bootstrap check: $*" >&2
      exit 1
    }

    [ "$(sha256sum "$PKG_SOURCE_ROOT/gcc-16.1.0.tar.xz" | awk '{print $1}')" = \
      50efb4d94c3397aff3b0d61a5abd748b4dd31d9d3f2ab7be05b171d36a510f79 ] || \
      fail 'retained GCC source digest differs from admission'

    gcc="$PKG_PACKAGE_ROOT/usr/bin/gcc"
    gxx="$PKG_PACKAGE_ROOT/usr/bin/g++"
    filesystem="$PKG_CHECK_INPUT_ROOT/filesystem"
    glibc="$PKG_CHECK_INPUT_ROOT/glibc"
    linux_headers="$PKG_CHECK_INPUT_ROOT/linux-api-headers"
    binutils="$PKG_CHECK_INPUT_ROOT/binutils-bootstrap/usr/bin"

    test -x "$gcc" || fail 'sealed gcc driver is absent'
    test -x "$gxx" || fail 'sealed g++ driver is absent'
    test -x "$binutils/as" || fail 'admitted assembler is absent'
    test -x "$binutils/ld" || fail 'admitted linker is absent'
    test -x "$binutils/readelf" || fail 'admitted ELF inspector is absent'
    test -L "$filesystem/lib64" || fail 'admitted filesystem /lib64 authority is absent'
    test -L "$filesystem/usr/lib64" || fail 'admitted filesystem /usr/lib64 authority is absent'
    test -x "$glibc/usr/lib/ld-linux-x86-64.so.2" || fail 'admitted glibc loader is absent'
    test -f "$linux_headers/usr/include/linux/errno.h" ||
      fail 'admitted Linux UAPI errno authority is absent'

    check_sysroot=/tmp/gcc-bootstrap-check-sysroot
    rm -rf "$check_sysroot"
    mkdir -p "$check_sysroot"
    add_check_sysroot_authority()
    {
      tree=$1
      label=$2
      (
        cd "$tree"
        find . \( -type f -o -type l \) -print
      ) | while IFS= read -r path; do
        test ! -e "$check_sysroot/$path" && test ! -L "$check_sysroot/$path" ||
          fail "check sysroot authority collision: $label:$path"
      done
      (cd "$tree" && tar -cf - .) | (cd "$check_sysroot" && tar -xf -)
    }
    add_check_sysroot_authority "$filesystem" filesystem
    add_check_sysroot_authority "$glibc" glibc
    add_check_sysroot_authority "$linux_headers" linux-api-headers
    test -L "$check_sysroot/lib64" || fail 'composed check sysroot lost /lib64 topology'
    test -L "$check_sysroot/usr/lib64" || fail 'composed check sysroot lost /usr/lib64 topology'
    test -e "$check_sysroot/lib64/ld-linux-x86-64.so.2" ||
      fail 'composed check sysroot cannot resolve the glibc loader'
    test -f "$check_sysroot/usr/include/linux/errno.h" ||
      fail 'composed check sysroot lost Linux UAPI authority'

    # The checked package owns its static C++ target support while filesystem
    # owns the /usr/lib64 -> lib topology through which GCC's x86_64 search
    # convention reaches it.  Realize that exact combined target view here
    # rather than letting the retained S0 root satisfy a compiler lookup.
    for library in "$PKG_PACKAGE_ROOT/usr/lib/"*.a; do
      test -f "$library" || continue
      target="$check_sysroot/usr/lib/${library##*/}"
      test ! -e "$target" && test ! -L "$target" ||
        fail "check target-root static-library collision: ${library##*/}"
      install -m 0644 "$library" "$target"
    done
    test -f "$check_sysroot/usr/lib/libstdc++.a" ||
      fail 'composed check target root lacks sealed static libstdc++ authority'

    test "$($gcc -print-sysroot)" = / || fail 'sealed compiler sysroot differs from execution root'
    test "$($gcc -print-prog-name=as)" = /usr/bin/as || \
      fail 'sealed compiler assembler coordinate differs from /usr/bin/as'
    test "$($gcc -print-prog-name=ld)" = /usr/bin/ld || \
      fail 'sealed compiler linker coordinate differs from /usr/bin/ld'
    private_libgcc=$($gcc -print-libgcc-file-name)
    private_libstdcxx=$($gxx --sysroot="$check_sysroot" -print-file-name=libstdc++.a)
    test -f "$private_libgcc" || fail 'sealed compiler private libgcc is unresolved'
    test -f "$private_libstdcxx" || fail 'sealed compiler static libstdc++ is unresolved'
    case $private_libgcc in
      "$PKG_PACKAGE_ROOT"/*) ;;
      *) fail 'sealed compiler resolves private libgcc outside its package authority' ;;
    esac
    case $private_libstdcxx in
      "$check_sysroot"/*) ;;
      *) fail 'sealed compiler resolves static libstdc++ outside admitted target root' ;;
    esac

    search=$($gcc -print-search-dirs)
    specs=$($gcc -dumpspecs)
    if printf '%s\n%s\n' "$search" "$specs" | \
        grep -E '/build/(inputs|work)|seed-root' >/dev/null; then
      fail 'sealed compiler search authority retains bootstrap coordinates'
    fi

    compiler_dir=$(find "$PKG_PACKAGE_ROOT/usr/lib/gcc" -mindepth 2 -maxdepth 2 \
      -type d -name '16.1.0' -print)
    test -n "$compiler_dir" || fail 'sealed compiler private directory is absent'
    test "$(printf '%s\n' "$compiler_dir" | wc -l | tr -d ' ')" = 1 || \
      fail 'sealed compiler private directory is ambiguous'
    test -x "$compiler_dir/collect2" || fail 'sealed link driver is absent'
    for program in \
        "$gcc" \
        "$gxx" \
        "$compiler_dir/cc1" \
        "$compiler_dir/cc1plus" \
        "$compiler_dir/collect2"; do
      test -x "$program" || fail "sealed compiler program is absent: ${program##*/}"
      dynamic=$("$binutils/readelf" -d "$program") || fail "readelf rejected sealed ${program##*/}"
      if printf '%s\n' "$dynamic" | grep -E '\((RPATH|RUNPATH)\)' >/dev/null; then
        fail "sealed ${program##*/} carries a construction search path"
      fi
      if printf '%s\n' "$dynamic" | grep -E \
          'Shared library: \[(libstdc\+\+|libgcc_s|libgmp|libmpfr|libmpc|libz|libzstd)\.so' \
          >/dev/null; then
        fail "sealed ${program##*/} retains seed/external compiler-runtime authority"
      fi
      interpreter=$("$binutils/readelf" -l "$program" | \
        sed -n 's/.*Requesting program interpreter: \([^]]*\)\].*/\1/p')
      case $interpreter in
        /lib/ld-linux-x86-64.so.2|/lib64/ld-linux-x86-64.so.2|/usr/lib/ld-linux-x86-64.so.2) ;;
        *) fail "sealed ${program##*/} names an unknown execution loader" ;;
      esac
      test -x "$check_sysroot$interpreter" ||
        fail "sealed ${program##*/} execution loader does not resolve through admitted target root"
    done

    cat >/tmp/gcc-bootstrap-check.c <<'C'
    #include <stdio.h>
    int main(void)
    {
      return puts("gcc-bootstrap-c") < 0;
    }
    C
    "$gcc" -std=c11 --sysroot="$check_sysroot" -B"$binutils/" \
      /tmp/gcc-bootstrap-check.c -o /tmp/gcc-bootstrap-check-c || \
      fail 'sealed C compiler rejected admitted target sysroot/binutils authority'

    cat >/tmp/gcc-bootstrap-check.cpp <<'CXX'
    #include <cstdio>
    int main()
    {
      return std::puts("gcc-bootstrap-cxx") < 0;
    }
    CXX
    "$gxx" -std=c++14 --sysroot="$check_sysroot" -B"$binutils/" \
      /tmp/gcc-bootstrap-check.cpp -o /tmp/gcc-bootstrap-check-cxx || \
      fail 'sealed C++ compiler rejected admitted target sysroot/binutils authority'

    for binary in /tmp/gcc-bootstrap-check-c /tmp/gcc-bootstrap-check-cxx; do
      "$binutils/readelf" -l "$binary" | \
        grep -F 'Requesting program interpreter: /lib64/ld-linux-x86-64.so.2' \
        >/dev/null || fail 'compiled witness names the wrong target loader'
      dynamic=$("$binutils/readelf" -d "$binary") || fail 'readelf rejected compiled witness'
      if printf '%s\n' "$dynamic" | \
          grep -E 'Shared library: \[(libstdc\+\+|libgcc_s|libgmp|libmpfr|libmpc|libz|libzstd)\.so' \
          >/dev/null; then
        fail 'bootstrap witness retained a forbidden shared compiler-runtime edge'
      fi
      "$glibc/usr/lib/ld-linux-x86-64.so.2" \
        --library-path "$glibc/usr/lib" "$binary" >/dev/null || \
        fail 'compiled witness does not execute through admitted glibc authority'
    done
architectures:
  build: [x86_64]
  target: [x86_64]
