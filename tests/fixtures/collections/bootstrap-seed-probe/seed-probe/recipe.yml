format: zeppe-lin.recipe/1
package:
  name: seed-probe
  version: 1.0
  release: 1
  summary: Native bootstrap seed execution qualification
  licenses:
    - GPL-3.0-or-later
requirements: {}
sources: []
build:
  language: posix-shell
  script: |
    set -eu

    fail()
    {
      printf '%s\n' "seed-probe build: $*" >&2
      exit 1
    }

    [ -c /dev/null ] || fail '/dev/null is not a character device'
    [ "$TMPDIR" = /tmp ] || fail 'TMPDIR is not /tmp'
    [ "$HOME" = /build/work/home ] || fail 'HOME is not the private build home'
    : >"$TMPDIR/seed-probe.tmp"
    : >"$HOME/seed-probe.home"

    /bin/sh -c 'printf "%s\n" shell-ok >/tmp/seed-probe.shell'
    [ "$(cat /tmp/seed-probe.shell)" = shell-ok ] || fail '/bin/sh did not execute inside the seed root'

    for tool in \
      ar as awk basename bison cat cc chmod cp dirname expr find flex g++ gawk gcc \
      grep install ld ln ls m4 make mkdir mv nm objcopy objdump python3 ranlib \
      readelf rm sed sha256sum sort strip tar touch tr uname wc xz; do
      command -v "$tool" >/dev/null 2>&1 || fail "required seed tool is unavailable: $tool"
    done

    printf '%s\n' alpha beta > text
    grep -Fx alpha text >/dev/null
    [ "$(awk 'END { print NR }' text)" = 2 ] || fail 'awk did not execute'
    [ "$(gawk 'END { print NR }' text)" = 2 ] || fail 'gawk did not execute'
    [ "$(sed -n '2p' text)" = beta ] || fail 'sed did not execute'
    [ "$(find . -maxdepth 1 -name text -print)" = ./text ] || fail 'find did not execute'
    [ "$(printf '%s\n' one | wc -l | tr -d ' ')" = 1 ] || fail 'wc/tr pipeline failed'
    sha256sum text | awk '{ if (length($1) != 64) exit 1 }' || fail 'sha256sum/awk pipeline failed'
    uname -m >/dev/null || fail 'uname did not execute'

    mkdir tar-source tar-result
    cp text tar-source/payload
    tar -cf payload.tar -C tar-source payload
    tar -xf payload.tar -C tar-result
    [ "$(cat tar-result/payload)" = "$(cat tar-source/payload)" ] || fail 'tar round trip failed'
    xz -c text > text.xz
    xz -dc text.xz > text.unxz
    [ "$(cat text.unxz)" = "$(cat text)" ] || fail 'xz round trip failed'

    printf 'changequote([,])dnl\nseed-m4-ok\n' | m4 | grep -F seed-m4-ok >/dev/null || \
      fail 'm4 did not execute'

    cat > parser.y <<'PARSER'
    %{
    int yylex(void) { return 0; }
    void yyerror(const char *s) { (void)s; }
    %}
    %%
    input: ;
    %%
    PARSER
    bison -o parser.c parser.y || fail 'bison could not generate parser source'
    test -s parser.c || fail 'bison generated no parser source'

    cat > scanner.l <<'SCANNER'
    %option noyywrap
    %%
    . ;
    %%
    SCANNER
    flex -o scanner.c scanner.l || fail 'flex could not generate scanner source'
    test -s scanner.c || fail 'flex generated no scanner source'

    python3 -c 'import os, pathlib, tempfile; assert pathlib.Path("/dev/null").is_char_device(); assert os.environ["TMPDIR"] == "/tmp"; assert os.environ["HOME"] == "/build/work/home"; tempfile.NamedTemporaryFile(dir="/tmp").close()'

    cat > conftest.c <<'C'
    #include <stdio.h>
    int main(void) { return puts("c-ok") < 0; }
    C
    cc -c conftest.c -o conftest-cc.o
    gcc -c conftest.c -o conftest.o
    ar rcs libseed-probe.a conftest.o
    ranlib libseed-probe.a
    nm libseed-probe.a | grep -F ' T main' >/dev/null || fail 'archive/nm probe failed'
    objdump -f conftest.o >/dev/null || fail 'objdump rejected compiler output'
    objcopy --only-keep-debug conftest.o conftest.debug || fail 'objcopy rejected compiler output'
    gcc conftest.c -o conftest
    c_output=$(./conftest) || fail 'seed C binary did not execute'
    [ "$c_output" = c-ok ] || fail 'seed C binary produced unexpected output'
    readelf -h conftest >/dev/null || fail 'readelf rejected seed C binary'
    cp conftest conftest.stripped
    strip conftest.stripped || fail 'strip rejected seed C binary'

    cat > conftest.cc <<'CXX'
    #include <iostream>
    int main() { std::cout << "cxx-ok\n"; return 0; }
    CXX
    g++ -std=c++14 conftest.cc -o conftest-cxx
    cxx_output=$(./conftest-cxx) || fail 'seed C++14 binary did not execute'
    [ "$cxx_output" = cxx-ok ] || fail 'seed C++14 binary produced unexpected output'

    cat > multiprecision.cc <<'MPC'
    #include <gmp.h>
    #include <mpfr.h>
    #include <mpc.h>
    int main()
    {
      mpz_t integer;
      mpfr_t real;
      mpc_t complex;
      mpz_init_set_ui(integer, 7);
      mpfr_init2(real, 64);
      mpc_init2(complex, 64);
      mpc_clear(complex);
      mpfr_clear(real);
      mpz_clear(integer);
      return 0;
    }
    MPC
    g++ -std=c++14 multiprecision.cc -lmpc -lmpfr -lgmp -o multiprecision
    ./multiprecision || fail 'GMP/MPFR/MPC development closure is not executable'

    cat > Makefile <<'MAKE'
    .RECIPEPREFIX := >
    all:
    >@/bin/sh -c 'printf "%s\\n" make-shell-ok > make-shell.ok'
    MAKE
    make -f Makefile
    [ "$(cat make-shell.ok)" = make-shell-ok ] || fail 'make could not launch /bin/sh'

    mkdir -p "$PKG_DESTDIR/usr/libexec"
    install -m 0555 conftest "$PKG_DESTDIR/usr/libexec/seed-probe"
    printf '%s\n' qualified > "$PKG_DESTDIR/seed-probe.ok"
check:
  language: posix-shell
  script: |
    set -eu

    fail()
    {
      printf '%s\n' "seed-probe check: $*" >&2
      exit 1
    }

    [ -c /dev/null ] || fail '/dev/null is not a character device'
    [ "$TMPDIR" = /tmp ] || fail 'TMPDIR is not /tmp'
    [ "$HOME" = /tmp/home ] || fail 'HOME is not the private check home'
    : >"$TMPDIR/seed-probe-check.tmp"
    [ "$(cat "$PKG_PACKAGE_ROOT/seed-probe.ok")" = qualified ] || \
      fail 'checked package subject is not readable'
    "$PKG_PACKAGE_ROOT/usr/libexec/seed-probe" | grep -Fx c-ok >/dev/null || \
      fail 'checked package executable is not consumable'
    sha256sum "$PKG_PACKAGE_ROOT/seed-probe.ok" | \
      awk '{ if (length($1) != 64) exit 1 }' || \
      fail 'final-check sha256sum/awk closure is unavailable'
    readelf -h "$PKG_PACKAGE_ROOT/usr/libexec/seed-probe" >/dev/null || \
      fail 'final-check readelf is unavailable'
architectures:
  build: [x86_64]
  target: [x86_64]
