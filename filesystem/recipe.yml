format: zeppe-lin.recipe/1
package:
  name: filesystem
  version: 1.0.0
  release: 1
  summary: Zeppe-Lin merged-/usr filesystem hierarchy
  homepage: https://zeppe-lin.org/
  licenses:
    - GPL-3.0-or-later
requirements: {}
sources: []
build:
  language: posix-shell
  script: |
    set -eu

    for path in \
      boot dev dev/pts etc home media mnt opt proc run srv sys \
      usr usr/bin usr/include usr/lib usr/lib/modules usr/lib32 usr/local \
      usr/local/bin usr/local/include usr/local/lib usr/local/sbin \
      usr/local/share usr/sbin usr/share usr/share/man \
      var var/cache var/lib var/local var/lock var/log var/opt var/spool; do
      mkdir -p "$PKG_DESTDIR/$path"
    done

    mkdir -m 0750 "$PKG_DESTDIR/root"
    mkdir -m 1777 "$PKG_DESTDIR/tmp"
    mkdir -m 1777 "$PKG_DESTDIR/var/tmp"
    mkdir -m 1777 "$PKG_DESTDIR/dev/shm"

    ln -s usr/bin "$PKG_DESTDIR/bin"
    ln -s usr/sbin "$PKG_DESTDIR/sbin"
    ln -s usr/lib "$PKG_DESTDIR/lib"
    ln -s usr/lib32 "$PKG_DESTDIR/lib32"
    ln -s usr/lib64 "$PKG_DESTDIR/lib64"
    ln -s lib "$PKG_DESTDIR/usr/lib64"

    ln -s ../run "$PKG_DESTDIR/var/run"
    ln -s ../proc/self/mounts "$PKG_DESTDIR/etc/mtab"
