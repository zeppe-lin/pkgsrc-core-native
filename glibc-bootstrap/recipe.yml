format: zeppe-lin.recipe/1
package:
  name: glibc-bootstrap
  version: 2.44
  release: 1
  summary: GNU C Library bootstrap sysroot
  homepage: https://www.gnu.org/software/libc/
  licenses:
    - GPL-2.0 WITH Linux-syscall-note
    - GPL-2.0-or-later
    - LGPL-2.1-or-later
requirements:
  build:
    - package: linux-api-headers
sources:
  - url: https://ftp.gnu.org/gnu/glibc/glibc-2.44.tar.xz
    name: glibc-2.44.tar.xz
    unpack: archive
    sha256: 37f600f2bef3c5e8300147059568b2a2e40a7ad6ccc65ce942556d49429cc667
build:
  language: posix-shell
  script: |
    set -eu

    linux_headers="$PKG_BUILD_INPUT_ROOT/linux-api-headers/usr/include"
    test -d "$linux_headers/linux"
    test -d "$linux_headers/asm"

    mkdir glibc-bootstrap-build glibc-bootstrap-stage
    cd glibc-bootstrap-build

    stage=$(CDPATH= cd -- ../glibc-bootstrap-stage && pwd)

    libc_cv_slibdir=/usr/lib \
    libc_cv_rtlddir=/lib64 \
    ../glibc-2.44/configure \
      --prefix=/usr \
      --sysconfdir=/etc \
      --localstatedir=/var \
      --libdir=/usr/lib \
      --libexecdir=/usr/lib \
      --with-headers="$linux_headers" \
      --disable-profile \
      --disable-werror \
      --disable-build-nscd \
      --disable-timezone-tools \
      --enable-bind-now \
      --enable-multi-arch \
      --enable-stack-protector=strong \
      --without-gd \
      MAKEINFO=missing

    # Build a real libc link surface with the seed compiler. This package is
    # construction authority only, so it intentionally has no libgcc runtime
    # requirement and is never target/rootfs policy.
    make -j "$PKG_JOBS"
    make install_root="$stage" install

    # Publish one coherent GCC sysroot. Linux UAPI remains separate source
    # authority and is copied from its exact admitted package input.
    mkdir -p "$PKG_DESTDIR/usr/include"
    (
      cd "$linux_headers"
      tar -cf - .
    ) | (cd "$PKG_DESTDIR/usr/include" && tar --no-same-owner --no-same-permissions -xf -)
    (
      cd "$stage/usr/include"
      tar -cf - .
    ) | (cd "$PKG_DESTDIR/usr/include" && tar --no-same-owner --no-same-permissions -xf -)

    mkdir -p "$PKG_DESTDIR/usr/lib"
    for object in crt1.o crti.o crtn.o; do
      install -m 0644 "$stage/usr/lib/$object" "$PKG_DESTDIR/usr/lib/$object"
    done
    install -m 0644 "$stage/usr/lib/libc.so" "$PKG_DESTDIR/usr/lib/libc.so"
    install -m 0755 "$stage/usr/lib/libc.so.6" "$PKG_DESTDIR/usr/lib/libc.so.6"
    install -m 0644 \
      "$stage/usr/lib/libc_nonshared.a" \
      "$PKG_DESTDIR/usr/lib/libc_nonshared.a"

    # The final x86_64 runtime ABI names /lib64/ld-linux-x86-64.so.2. Mirror
    # the filesystem package topology inside this construction sysroot while
    # storing the loader bytes in canonical /usr/lib.
    loader="$stage/lib64/ld-linux-x86-64.so.2"
    test -e "$loader"
    install -m 0755 "$loader" "$PKG_DESTDIR/usr/lib/ld-linux-x86-64.so.2"
    ln -s lib "$PKG_DESTDIR/usr/lib64"
    ln -s usr/lib64 "$PKG_DESTDIR/lib64"

    test -f "$PKG_DESTDIR/usr/include/gnu/stubs.h"
    test -f "$PKG_DESTDIR/usr/include/linux/types.h"
    test -f "$PKG_DESTDIR/usr/lib/crt1.o"
    test -f "$PKG_DESTDIR/usr/lib/crti.o"
    test -f "$PKG_DESTDIR/usr/lib/crtn.o"
    test -f "$PKG_DESTDIR/usr/lib/libc.so"
    test -f "$PKG_DESTDIR/usr/lib/libc.so.6"
    test -f "$PKG_DESTDIR/usr/lib/libc_nonshared.a"
    test -f "$PKG_DESTDIR/usr/lib/ld-linux-x86-64.so.2"
    test -L "$PKG_DESTDIR/lib64"
architectures:
  build: [x86_64]
  target: [x86_64]
